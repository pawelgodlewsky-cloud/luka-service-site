<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Luka Service — Warszawa-Włochy</title>
  <desc id="desc">Znak warsztatu samochodowego: miedziane koło zębate z dwoma skrzyżowanymi tłokami oraz granatowo-miedziany logotyp.</desc>
  <defs>
    <g id="tooth">
      <rect x="156" y="31" width="28" height="50" rx="4" />
    </g>
    <g id="piston">
      <path d="M-31-89H31Q39-89 39-81V-49Q39-41 31-41H-31Q-39-41-39-49V-81Q-39-89-31-89Z" />
      <rect x="-34" y="-70" width="68" height="6" rx="3" fill="#0D1B23" />
      <rect x="-7" y="-44" width="14" height="92" rx="7" />
      <circle cy="57" r="24" />
      <circle cy="57" r="9" fill="#0D1B23" />
    </g>
  </defs>

  <g aria-hidden="true">
    <g fill="#C9824D">
      <use href="#tooth" />
      <use href="#tooth" transform="rotate(30 170 180)" />
      <use href="#tooth" transform="rotate(60 170 180)" />
      <use href="#tooth" transform="rotate(90 170 180)" />
      <use href="#tooth" transform="rotate(120 170 180)" />
      <use href="#tooth" transform="rotate(150 170 180)" />
      <use href="#tooth" transform="rotate(180 170 180)" />
      <use href="#tooth" transform="rotate(210 170 180)" />
      <use href="#tooth" transform="rotate(240 170 180)" />
      <use href="#tooth" transform="rotate(270 170 180)" />
      <use href="#tooth" transform="rotate(300 170 180)" />
      <use href="#tooth" transform="rotate(330 170 180)" />
      <circle cx="170" cy="180" r="118" />
    </g>
    <circle cx="170" cy="180" r="92" fill="#0D1B23" />
    <g fill="#F4F2ED" transform="translate(170 180)">
      <use href="#piston" transform="rotate(-43) scale(.82)" />
      <use href="#piston" transform="rotate(43) scale(.82)" />
    </g>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-weight="900">
    <text x="347" y="180" font-size="100" letter-spacing="-2" fill="#0D1B23">LUKA</text>
    <text x="680" y="180" font-size="100" letter-spacing="-2" fill="#C9824D">SERVICE</text>
  </g>
  <path d="M352 222H1128" stroke="#0D1B23" stroke-width="3" opacity=".14" />
  <text x="350" y="275" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" letter-spacing="9" fill="#0D1B23">WARSZAWA-WŁOCHY</text>
</svg>
